name: hermes-lover
version: "0.1.0"
description: "Generic digital-life runtime for Hermes: persistent affect, memory affinity, and bounded reflection."
author: pengyu
license: MIT
requires_hermes: ">=0.22"
kind: standalone
# v0.1.0 reads no plugin configuration. Scheduled reflection is an explicit
# automation blueprint rather than a setting, and delivery is not implemented.
config_schema: {}
provides_tools:
  - digital_life_status
provides_hooks:
  - pre_llm_call
  - post_tool_call
  - post_llm_call
  - api_request_error
provides_middleware:
  - llm_request
