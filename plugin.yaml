name: hermes-lover
version: "0.1.0"
description: "Generic digital-life runtime for Hermes: persistent affect, memory affinity, and bounded reflection."
author: pengyu
license: MIT
requires_hermes: ">=0.22"
kind: standalone
config_schema:
  wake:
    type: dict
    default: {enabled: false}
    description: "Opt-in self-wake queue. enabled must be a boolean; delivery also needs plugins.entries.hermes-lover.allow_gateway_injection: true in the profile config."
  memory:
    type: dict
    default: {writes_enabled: true, capture: true}
    description: "Event-memory settings: writes_enabled and capture must be booleans (default true)."
  temperament:
    type: dict
    default: {sensitivity: 1.0, resilience: 1.0, enthusiasm: 50.0, metabolism: 1.0}
    description: "Four operator knobs, clamped: sensitivity 0.5-2.0, resilience 0.5-2.0, enthusiasm 20-80, metabolism 0.5-2.0."
  life:
    type: dict
    default: {enabled: true, tick_minutes: 5}
    description: "Your own small day: a five-minute heartbeat builds a short agenda (read, think over an open loop, a note, rest) from material the process can actually reach, leaves traces in memory, and refreshes the mood stamp. enabled: false freezes it without touching anything else; tick_minutes 1-60."
  stress_cortisol:
    type: number
    default: 80
    description: "Cortisol level (0-100) at which the stress directive and narrow attention engage; 0-100."
provides_tools:
  - memory_write
  - memory_recall
  - memory_revoke
  - digital_life_status
  - close_gap
  - beat_targets
  - beat_send
  - search_later
  - study_source
  - background_task
  - qzone_feed
  - qzone_bridge
  - read_source
  - library_list
provides_hooks:
  - pre_llm_call
  - pre_tool_call
  - pre_gateway_dispatch
  - transform_llm_output
  - post_tool_call
  - post_llm_call
  - api_request_error
provides_middleware:
  - llm_request
