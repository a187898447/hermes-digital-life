name: hermes-lover
version: "0.1.0"
description: "Generic digital-life runtime for Hermes: persistent affect, memory affinity, and bounded reflection."
author: pengyu
license: MIT
requires_hermes: ">=0.22"
kind: standalone
config_schema:
  memory:
    type: dict
    default: {writes_enabled: true}
    description: "Event-memory settings: writes_enabled must be a boolean (default true)."
provides_tools:
  - memory_write
  - memory_recall
  - digital_life_status
provides_hooks:
  - pre_llm_call
  - post_tool_call
  - post_llm_call
  - api_request_error
provides_middleware:
  - llm_request
