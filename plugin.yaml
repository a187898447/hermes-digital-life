name: hermes-lover
version: "0.1.0"
description: "Generic digital-life runtime for Hermes: persistent affect, memory affinity, and bounded reflection."
author: pengyu
license: MIT
requires_hermes: ">=0.22"
kind: standalone
python_dependencies:
  - "psutil>=5.9,<8"
config_schema:
  memory:
    type: dict
    default: {writes_enabled: true, capture: true}
    description: "Event-memory settings: writes_enabled and capture must be booleans (default true)."
provides_tools:
  - memory_write
  - memory_recall
  - digital_life_status
  - beat_targets
  - beat_send
provides_hooks:
  - pre_llm_call
  - pre_gateway_dispatch
  - transform_llm_output
  - post_tool_call
  - post_llm_call
  - api_request_error
provides_middleware:
  - llm_request
